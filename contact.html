  <nav>

<main>

  <section class="panel">
    <h1>Contact me</h1>
    <p class="tagline">Reach out here!</p>
    <ul class="plain">
      <li><strong>GitHub</strong> <a class="text-link" href="https://github.com/lnasir23" target="_blank" rel="noopener">github.com/lnasir23</a></li>
      <li><strong>Email</strong>  laiba@example.com</li>
    </ul>
  </section>

  <section class="panel">
    <h2>Send a message</h2>
    <form class="contact-form" action="mailto:laiba@example.com" method="post" enctype="text/plain">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">Your email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit">Send</button>
    </form>
  </section>

</main>

</body>
